name: "Deploy to NuGet"

on:
  push:
    branches: [ master ]
    tags:
    - 'v[0-9]+\.[0-9]+\.[0-9]+'
    - 'v[0-9]+\.[0-9]+\.[0-9]+-beta[0-9][0-9]'
  pull_request:
    branches: [ master ]

env:
  PACKAGE_OUTPUT_DIRECTORY: ${{ github.workspace }}\output
  NUGET_SOURCE_URL: 'https://api.nuget.org/v3/index.json'

permissions:
  contents: read
  
jobs:
  build:
    name: 'Build'
    runs-on: 'windows-latest'
    steps:
    - name: 'Checkout'
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false

    - name: 'Install dotnet'
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: | 
            8.x
            10.x
        global-json-file: global.json
      
    - name: 'Restore packages'
      run: dotnet restore

    - name: 'Build project'
      run: dotnet build --no-restore --configuration Release

    - name: Test .NET 10 with coverage
      id: test-net10
      run: dotnet test --configuration Release --no-build --framework net10.0 --report-trx --coverage --coverage-settings coverage.settings.xml --coverage-output-format cobertura --coverage-output net10.0.cobertura.xml --results-directory TestResults

    - name: Test .NET 8 with coverage
      if: ${{ !cancelled() && steps.test-net10.outcome != 'skipped' }}
      run: dotnet test --configuration Release --no-build --framework net8.0 --report-trx --coverage --coverage-settings coverage.settings.xml --coverage-output-format cobertura --coverage-output net8.0.cobertura.xml --results-directory TestResults

    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: ${{ !cancelled() && steps.test-net10.outcome != 'skipped' }}
      with:
        name: test-results
        path: TestResults/*.trx
        if-no-files-found: error

    - name: Make coverage source paths repository-relative
      if: ${{ !cancelled() && steps.test-net10.outcome != 'skipped' }}
      shell: pwsh
      run: |
        Get-ChildItem TestResults/*.cobertura.xml | ForEach-Object {
          [xml]$report = Get-Content -Raw $_.FullName
          foreach ($class in $report.SelectNodes('//class')) {
            $class.filename = [IO.Path]::GetRelativePath($env:GITHUB_WORKSPACE, $class.filename).Replace('\', '/')
            if ($class.filename.StartsWith('../') -or !(Test-Path -LiteralPath $class.filename -PathType Leaf)) {
              throw "Coverage source is not a repository file: $($class.filename)"
            }
          }
          $report.Save($_.FullName)
        }

    - name: Upload coverage artifact
      uses: actions/upload-artifact@v7
      if: ${{ !cancelled() && steps.test-net10.outcome != 'skipped' }}
      with:
        name: code-coverage
        path: TestResults/*.cobertura.xml
        if-no-files-found: error

  report:
    name: DotNET Tests
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: test-results
        path: TestResults

    - uses: dorny/test-reporter@v3
      with:
        name: DotNET Tests
        path: TestResults/*.trx
        reporter: dotnet-trx
        use-actions-summary: 'true'
        max-annotations: '0'
        fail-on-error: 'true'
        fail-on-empty: 'true'

    - name: Require successful build and test execution
      if: ${{ !cancelled() && needs.build.result != 'success' }}
      run: exit 1

  coverage:
    name: Code coverage (${{ matrix.framework }})
    needs: build
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository || github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        framework: [net10.0, net8.0]
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: code-coverage
        path: coverage

    - uses: actions/upload-code-coverage@v1
      with:
        file: coverage/${{ matrix.framework }}.cobertura.xml
        language: C#
        label: code-coverage/${{ matrix.framework }}

  deploy:
    name: 'Pack'
    runs-on: 'windows-latest'
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: 'Checkout'
      uses: actions/checkout@v7

    - name: 'Install dotnet'
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: 'Get Version'
      id: version
      uses: battila7/get-version-action@v2

    - name: 'Pack project'
      run: dotnet pack --configuration Release --include-symbols -p:Version=${{ steps.version.outputs.version-without-v }} --output ${{ env.PACKAGE_OUTPUT_DIRECTORY }}
      # --no-build somehow cannot be used due to being needed: 

    - name: 'Upload packages'
      uses: actions/upload-artifact@v7
      with:
        name: packages
        path: ${{ env.PACKAGE_OUTPUT_DIRECTORY }}
        if-no-files-found: error

  # Only this job can request an OIDC token, so build, test and pack code cannot mint a NuGet key.
  publish:
    name: 'Push to NuGet'
    runs-on: 'ubuntu-latest'
    needs: deploy
    # The nuget.org policy accepts only this environment, and the environment accepts only release tags.
    environment: nuget
    permissions:
      id-token: write # NuGet trusted publishing: the OIDC token is exchanged for a one-hour API key

    steps:
    - name: 'Download packages'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, pinned: this job can mint the publish key
      with:
        name: packages
        path: output

    - name: 'Install dotnet'
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0, pinned: this job can mint the publish key
      with:
        dotnet-version: '10.0.x'

    - name: 'NuGet login'
      id: nuget-login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0, pinned: this step handles the publish credential
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: 'Push package'
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: dotnet nuget push output/*.nupkg -k "$NUGET_API_KEY" -s ${{ env.NUGET_SOURCE_URL }} --skip-duplicate
